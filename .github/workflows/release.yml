name: Build and publish GlassMenu JAR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: Build GlassMenu
        run: gradle --no-daemon build
      - name: Publish direct JAR download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('GlassMenu {0}', github.ref_name) || 'GlassMenu Latest Build' }}
          body: |
            Download the **.jar** asset below and place it in your Minecraft `mods` folder.
            Requires Fabric Loader, Fabric API, and Java 25 for Minecraft 26.2.
            This release is automatically refreshed from the main branch.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          overwrite_files: true
          files: build/libs/glassmenu-*.jar
          fail_on_unmatched_files: true
